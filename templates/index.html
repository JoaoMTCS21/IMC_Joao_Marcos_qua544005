<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IMC | Índice de Massa Corporal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>

    <div class="container">
        <main class="d-flex justify-content-center align-items-center vh-100">
            <div class="row w-100 justify-content-center">
                <div class="col-12 col-md-6">
                    <div class="text-center">
                        <h1>IMC</h1>
                        <hr>
                        <h2>Índice de Massa Corporal</h2>
                    </div>

                    <form action="" method="POST" class="mt-4">
                        <div class="mb-3">
                            <label for="massa" class="form-label">Massa em kg:</label>
                            <input type="number" step="0.01" name="massa" class="form-control" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label for="altura" class="form-label">Altura em metros:</label>
                            <input type="number" step="0.01" name="altura" class="form-control" min="0" required>
                        </div>
                
                        <div class="d-flex justify-content-center mt-5">
                            <button type="submit" class="btn btn-success">Calcular IMC</button>
                        </div>
                    </form>

                    <div class="d-flex justify-content-center mt-5">
                        {% if result %}
                            <hr>
                            <h3>{{ result }}</h3>
                        {% else %}
                           <span></span>
                        {% endif %}
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
